[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threads-lyr"
version = "0.1.0"
description = "Threads.net MCP server using anonymous web scraping"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0.0",
    "curl-cffi>=0.7.0",
    "python-dotenv>=1.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
threads-lyr = "threads_mcp_server.cli_wrapper:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["threads_mcp_server*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastMCP dependency-injection pattern (ctx: Context = CurrentContext()) —
#       intentional, mirrors facebook-lyr. BLE001: the error handler and client
#       deliberately catch all exceptions to surface ToolErrors.
ignore = ["B008", "BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
